# challenges/sprint1-otw/bandit-sprint1.yml
# OTW Bandit levels 0-15 — Sprint 1 gate challenges.
# Load with: ctf challenge push --ctfd-url http://ctfd.ctf.local
#
# Flag for each level = the password OTW gives you upon solving it.
# Passwords change occasionally on OTW's end; cadre verify against
# https://overthewire.org/wargames/bandit/ if a flag is rejected.

challenges:
  - name: "Bandit Level 0 → 1"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Connect to Bandit

      The goal of this level is to log into the game using SSH.
      The host to which you need to connect is **bandit.labs.overthewire.org**
      on **port 2220**. The username is **bandit0** and the password is **bandit0**.

      ```
      ssh bandit0@bandit.labs.overthewire.org -p 2220
      ```

      Once logged in, find the password for the next level. It is stored in a
      file called **readme** in the home directory. Read it with `cat readme`.

      Submit the password you find as the flag.

      🔗 [OTW Bandit Level 0](https://overthewire.org/wargames/bandit/bandit1.html)
    value: 10
    type: standard
    flags:
      - ZjLjTmM6FvvyRnrb2rfNWOZOTa6ip5If
    tags:
      - ssh
      - linux-basics
    hints:
      - cost: 0
        content: "Use the `cat` command to read a file."
    requirements:
      prerequisites: []

  - name: "Bandit Level 1 → 2"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Dashed filename

      The password for level 2 is stored in a file called **-** in the home directory.

      Connect:
      ```
      ssh bandit1@bandit.labs.overthewire.org -p 2220
      ```
      Use the password you found in Level 0 as the login password.

      **Hint:** Reading a file named `-` requires a special approach since `-` means
      stdin to many commands. Try `cat ./-` or `cat < -`.

      🔗 [OTW Bandit Level 1](https://overthewire.org/wargames/bandit/bandit2.html)
    value: 10
    type: standard
    flags:
      - 263JMywhZjy3fPAsev5PFM5svgrSHblh
    tags:
      - ssh
      - linux-basics
      - filenames
    hints:
      - cost: 0
        content: "Files with special names need special handling. Try `cat ./-`"
    requirements:
      prerequisites:
        - "Bandit Level 0 → 1"

  - name: "Bandit Level 2 → 3"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Spaces in filename

      The password is in a file called **spaces in this filename**.

      Connect:
      ```
      ssh bandit2@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** Use tab completion or quote the filename.

      🔗 [OTW Bandit Level 2](https://overthewire.org/wargames/bandit/bandit3.html)
    value: 10
    type: standard
    flags:
      - MNk8KNH3Usiio41PRUEoDFPqfxLPlSmx
    tags:
      - ssh
      - linux-basics
      - filenames
    hints:
      - cost: 0
        content: 'Try: cat "spaces in this filename" or use tab completion'
    requirements:
      prerequisites:
        - "Bandit Level 1 → 2"

  - name: "Bandit Level 3 → 4"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Hidden file

      The password is stored in a **hidden file** in the `inhere` directory.

      Connect:
      ```
      ssh bandit3@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** Hidden files start with a dot. Use `ls -la` to see them.

      🔗 [OTW Bandit Level 3](https://overthewire.org/wargames/bandit/bandit4.html)
    value: 10
    type: standard
    flags:
      - 2WmrDFRmJIq3IPxneAaMGhap0pFhF3NJ
    tags:
      - ssh
      - linux-basics
      - hidden-files
    hints:
      - cost: 0
        content: "ls -la shows hidden files (those starting with a dot)"
    requirements:
      prerequisites:
        - "Bandit Level 2 → 3"

  - name: "Bandit Level 4 → 5"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Human-readable file

      The password is in the only **human-readable file** in the `inhere` directory.
      There are 10 files (-file00 through -file09).

      Connect:
      ```
      ssh bandit4@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** Use the `file` command to identify file types.

      🔗 [OTW Bandit Level 4](https://overthewire.org/wargames/bandit/bandit5.html)
    value: 15
    type: standard
    flags:
      - 4oQYVPkxZOOEOO5pTW81FB8j8lxXGUQw
    tags:
      - ssh
      - file-types
    hints:
      - cost: 0
        content: "Run: file inhere/* to see which file contains ASCII text"
    requirements:
      prerequisites:
        - "Bandit Level 3 → 4"

  - name: "Bandit Level 5 → 6"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Find by properties

      The password is in a file somewhere under `inhere/` that is:
      - Human-readable
      - 1033 bytes in size
      - Not executable

      Connect:
      ```
      ssh bandit5@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** The `find` command with `-size` and `-not -executable` flags.

      🔗 [OTW Bandit Level 5](https://overthewire.org/wargames/bandit/bandit6.html)
    value: 15
    type: standard
    flags:
      - HWasnPhtq9AVKe0dmk45nxy20cvUa6EG
    tags:
      - ssh
      - find
      - file-properties
    hints:
      - cost: 0
        content: "find inhere/ -size 1033c -not -executable"
    requirements:
      prerequisites:
        - "Bandit Level 4 → 5"

  - name: "Bandit Level 6 → 7"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Find anywhere on server

      The password is stored **somewhere on the server** and has all of:
      - Owned by user bandit7
      - Owned by group bandit6
      - 33 bytes in size

      Connect:
      ```
      ssh bandit6@bandit.labs.overthewire.org -p 2220
      ```

      🔗 [OTW Bandit Level 6](https://overthewire.org/wargames/bandit/bandit7.html)
    value: 15
    type: standard
    flags:
      - morbNTDkSW6jIlUc0ymOdMaLnOlFVAaj
    tags:
      - ssh
      - find
      - permissions
    hints:
      - cost: 0
        content: "find / -user bandit7 -group bandit6 -size 33c 2>/dev/null"
    requirements:
      prerequisites:
        - "Bandit Level 5 → 6"

  - name: "Bandit Level 7 → 8"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Grep in large file

      The password is stored in `data.txt` next to the word **millionth**.

      Connect:
      ```
      ssh bandit7@bandit.labs.overthewire.org -p 2220
      ```

      🔗 [OTW Bandit Level 7](https://overthewire.org/wargames/bandit/bandit8.html)
    value: 10
    type: standard
    flags:
      - dfwvzFQi4mU0wfNbFOe9RoWskMLg7eEc
    tags:
      - ssh
      - grep
      - text-processing
    hints:
      - cost: 0
        content: "grep millionth data.txt"
    requirements:
      prerequisites:
        - "Bandit Level 6 → 7"

  - name: "Bandit Level 8 → 9"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Unique line

      The password is the only line in `data.txt` that occurs only **once**.

      Connect:
      ```
      ssh bandit8@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** `sort` then `uniq -u`

      🔗 [OTW Bandit Level 8](https://overthewire.org/wargames/bandit/bandit9.html)
    value: 15
    type: standard
    flags:
      - 4CKMh1JI91bUIZZPXDqGanal4xvAg0JM
    tags:
      - ssh
      - sort
      - uniq
      - text-processing
    hints:
      - cost: 0
        content: "sort data.txt | uniq -u"
    requirements:
      prerequisites:
        - "Bandit Level 7 → 8"

  - name: "Bandit Level 9 → 10"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Strings in binary

      The password is in `data.txt` among a few human-readable strings,
      preceded by several **=** characters.

      Connect:
      ```
      ssh bandit9@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** The `strings` command extracts readable text from binary files.

      🔗 [OTW Bandit Level 9](https://overthewire.org/wargames/bandit/bandit10.html)
    value: 15
    type: standard
    flags:
      - FGUW5ilLVJrxX9kMYMmlN4MgbpfMiqey
    tags:
      - ssh
      - strings
      - binary
    hints:
      - cost: 0
        content: "strings data.txt | grep ==="
    requirements:
      prerequisites:
        - "Bandit Level 8 → 9"

  - name: "Bandit Level 10 → 11"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Base64 decode

      The password is in `data.txt`, encoded in **base64**.

      Connect:
      ```
      ssh bandit10@bandit.labs.overthewire.org -p 2220
      ```

      🔗 [OTW Bandit Level 10](https://overthewire.org/wargames/bandit/bandit11.html)
    value: 10
    type: standard
    flags:
      - dtR173fZKb0RRsDFSGsg2RWnpNVj3qRr
    tags:
      - ssh
      - encoding
      - base64
    hints:
      - cost: 0
        content: "base64 -d data.txt"
    requirements:
      prerequisites:
        - "Bandit Level 9 → 10"

  - name: "Bandit Level 11 → 12"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## ROT13

      The password is in `data.txt`, encoded with **ROT13** (all letters
      rotated 13 positions).

      Connect:
      ```
      ssh bandit11@bandit.labs.overthewire.org -p 2220
      ```

      🔗 [OTW Bandit Level 11](https://overthewire.org/wargames/bandit/bandit12.html)
    value: 10
    type: standard
    flags:
      - 7x16WNeHIi5YkIhWsfFIqoognUTyj9Q4
    tags:
      - ssh
      - encoding
      - rot13
      - crypto
    hints:
      - cost: 0
        content: "cat data.txt | tr 'A-Za-z' 'N-ZA-Mn-za-m'"
    requirements:
      prerequisites:
        - "Bandit Level 10 → 11"

  - name: "Bandit Level 12 → 13"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Hexdump + repeated compression

      The password is in `data.txt`, a hexdump of a file that has been
      repeatedly compressed. Work in `/tmp` to decompress it step by step.

      Connect:
      ```
      ssh bandit12@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** `xxd -r` reverses a hexdump. Use `file` after each decompression
      to identify the format before choosing the next decompression tool.

      🔗 [OTW Bandit Level 12](https://overthewire.org/wargames/bandit/bandit13.html)
    value: 25
    type: standard
    flags:
      - FO5dwFsc0cbaIiH0h8J2eUks2vdTDwAn
    tags:
      - ssh
      - compression
      - xxd
      - gzip
      - bzip2
    hints:
      - cost: 5
        content: "mkdir /tmp/mydir && cp data.txt /tmp/mydir/ && cd /tmp/mydir && xxd -r data.txt > data.bin"
      - cost: 10
        content: "Use `file data.bin` after each step. Decompress with gzip/bzip2/tar as indicated."
    requirements:
      prerequisites:
        - "Bandit Level 11 → 12"

  - name: "Bandit Level 13 → 14"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## SSH private key

      The password for level 14 is stored in `/etc/bandit_pass/bandit14`,
      readable only by bandit14. You have an **SSH private key** that can
      log you in as bandit14.

      Connect:
      ```
      ssh bandit13@bandit.labs.overthewire.org -p 2220
      ```

      Then use the key you find to SSH to the next level:
      ```
      ssh -i sshkey.private bandit14@localhost -p 2220
      ```

      🔗 [OTW Bandit Level 13](https://overthewire.org/wargames/bandit/bandit14.html)
    value: 20
    type: standard
    flags:
      - MU4VWeTyJk8ROof1qlmMY3SUZzU5DVPQ
    tags:
      - ssh
      - private-key
      - authentication
    hints:
      - cost: 0
        content: "ssh -i sshkey.private bandit14@localhost -p 2220 then cat /etc/bandit_pass/bandit14"
    requirements:
      prerequisites:
        - "Bandit Level 12 → 13"

  - name: "Bandit Level 14 → 15"
    author: "OverTheWire"
    category: "OTW — Bandit"
    description: |
      ## Netcat to localhost

      Submit the current level's password to **port 30000 on localhost**.
      The server will respond with the next password.

      Connect:
      ```
      ssh bandit14@bandit.labs.overthewire.org -p 2220
      ```

      **Hint:** Use `nc localhost 30000` and paste the password.

      🔗 [OTW Bandit Level 14](https://overthewire.org/wargames/bandit/bandit15.html)
    value: 20
    type: standard
    flags:
      - 8xCjnmgoKbGLhHFAZlGE5Tmu4M2tKJQo
    tags:
      - ssh
      - netcat
      - networking
    hints:
      - cost: 0
        content: "echo 'MU4VWeTyJk8ROof1qlmMY3SUZzU5DVPQ' | nc localhost 30000"
    requirements:
      prerequisites:
        - "Bandit Level 13 → 14"

  # ── Sprint 1 Gate Marker ───────────────────────────────────────────────────
  # This challenge is automatically unlocked when Bandit 14->15 is solved.
  # It serves as the visible gate that unlocks Sprint 2 categories.
  - name: "🔓 Sprint 1 Complete — Sprint 2 Unlocked"
    author: "Platform"
    category: "Platform"
    description: |
      ## Sprint 1 Complete!

      You have demonstrated foundational Linux CLI fluency.

      **Sprint 2 is now unlocked.** You will see new challenge categories appear:
      - OTW Bandit Levels 16–34
      - OTW Natas (web security)
      - OTW Krypton (cryptography)
      - OTW Leviathan (binary basics)
      - OWASP Juice Shop (100+ web challenges)
      - PCAP/Log Analysis

      The flag for this challenge is: `CTF{sprint1_complete}`
    value: 50
    type: standard
    flags:
      - CTF{sprint1_complete}
    tags:
      - meta
    hints: []
    requirements:
      prerequisites:
        - "Bandit Level 14 → 15"
