---
apiVersion: k8s.cei-labs.local/v1
kind: ChallengePack
metadata:
  name: sprint2-web-exploitation
  namespace: ctf-challenges
spec:
  sprint: 2
  category: "Web Security"
  challenges:
    - id: "natas-0"
      title: "OverTheWire: Natas Baseline"
      difficulty: "Easy"
      points: 100
      description: "Inspect target raw DOM structures to extract primary configuration passcodes."
      flag_type: "static"
      secret: "CTF{source_code_inspection_is_fundamental}"

    - id: "juice-shop-xss"
      title: "JuiceShop Cross-Site Scripting (XSS)"
      difficulty: "Medium"
      points: 250
      description: "Inject a malicious payload to compromise the active administrator browser session matrix."
      flag_type: "dynamic"
      generator: "multijuicer-webhook-verify"