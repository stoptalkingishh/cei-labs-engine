name: Build CTFd image

on:
  push:
    branches: [main]
    paths:
      - "docker/ctfd/**"
      - ".github/workflows/build-ctfd.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/ctfd/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ctfd

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plugin test dependencies
        working-directory: docker/ctfd/plugins/instance-launcher
        run: pip install -r requirements.txt pytest

      - name: Run instance-launcher unit tests
        # Only orchestrator_client.py is tested here — it's the one module
        # with no CTFd dependency, so it can run without installing CTFd
        # itself. models.py/routes.py are exercised via the manual
        # verification steps in the migration plan (needs a real CTFd + DB).
        working-directory: docker/ctfd/plugins/instance-launcher
        run: pytest -q --import-mode=importlib tests/

  build-and-push:
    needs: test-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ctfd
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
