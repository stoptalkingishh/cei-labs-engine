name: Build CTFd image

on:
  push:
    branches: [main]
    paths:
      - "docker/ctfd/**"
      - ".github/workflows/build-ctfd.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/ctfd/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ctfd

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install instance-launcher test dependencies
        working-directory: docker/ctfd/plugins/instance-launcher
        # flask isn't in requirements.txt because in production it's
        # supplied by the CTFd base image (see docker/ctfd/Dockerfile);
        # test_secret_scrubbing.py loads routes.py directly, which imports
        # flask at module level, so it's installed explicitly here for CI.
        run: pip install -r requirements.txt pytest flask

      - name: Run instance-launcher unit tests
        # Runs this plugin's whole tests/ directory. CTFd/Flask/SQLAlchemy
        # internals that routes.py/models.py import at module level are
        # stubbed out with plain Python doubles inside the test modules
        # themselves, so the suite runs without installing CTFd itself.
        working-directory: docker/ctfd/plugins/instance-launcher
        run: pytest -q --import-mode=importlib tests/

      - name: Install hint-wallet test dependencies
        working-directory: docker/ctfd/plugins/hint-wallet
        # flask isn't in requirements.txt because in production it's
        # supplied by the CTFd base image (see docker/ctfd/Dockerfile);
        # test_routes.py exercises routes.py's blueprint through a real
        # Flask test client, so it's installed explicitly here for CI.
        run: pip install -r requirements.txt pytest flask

      - name: Run hint-wallet unit tests
        working-directory: docker/ctfd/plugins/hint-wallet
        run: pytest -q --import-mode=importlib tests/

      - name: Install modal-theme test dependencies
        working-directory: docker/ctfd/plugins/modal-theme
        # No requirements.txt: this plugin is CSS-only, and its tests only
        # read __init__.py and the stylesheet off disk (no CTFd/Flask
        # imports), so pytest is the only dependency needed.
        run: pip install pytest

      - name: Run modal-theme unit tests
        working-directory: docker/ctfd/plugins/modal-theme
        run: pytest -q --import-mode=importlib tests/

      - name: Install wargame-stages test dependencies
        working-directory: docker/ctfd/plugins/wargame-stages
        # No requirements.txt: logic.py has no third-party dependencies,
        # so pytest is the only dependency needed.
        run: pip install pytest

      - name: Run wargame-stages unit tests
        working-directory: docker/ctfd/plugins/wargame-stages
        run: pytest -q --import-mode=importlib tests/

  build-and-push:
    needs: test-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ctfd
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
