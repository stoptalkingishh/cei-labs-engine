name: Build TCP gateway image

on:
  push:
    branches: [main]
    paths:
      - "operator/tcp-gateway/**"
      - ".github/workflows/build-tcp-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: operator/tcp-gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tcp-gateway:latest
            ghcr.io/${{ github.repository }}/tcp-gateway:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
