name: Build Kali noVNC image

on:
  push:
    branches: [main]
    paths:
      - "operator/kali-novnc/**"
      - ".github/workflows/build-kali-novnc.yml"
  pull_request:
    branches: [main]
    paths:
      - "operator/kali-novnc/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ctf-kali-novnc
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: operator/kali-novnc
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          # No VNC_PASSWORD build-arg -- the image no longer bakes in a
          # password at all (see operator/kali-novnc/Dockerfile). The
          # orchestrator (or scripts/spawn-workspaces.sh for standalone
          # provisioning) generates one per instance and sets it via the
          # container's runtime environment instead.