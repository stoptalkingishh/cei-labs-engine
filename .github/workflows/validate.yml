name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: |
          if [ -d "k8s" ]; then
            find k8s/ -type f \( -name "*.yml" -o -name "*.yaml" \) | \
            xargs -r kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' || true
          else
            echo "No k8s directory found, skipping validation."
          fi

  validate-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install ansible-lint and core
        run: pip install ansible-lint ansible-core

      - name: Install Ansible collections
        run: |
          if [ -f "ansible/requirements.yml" ]; then
            ansible-galaxy collection install -r ansible/requirements.yml
          elif [ -f "requirements.yml" ]; then
            ansible-galaxy collection install -r requirements.yml
          else
            echo "No Ansible requirements file found, skipping collection install."
          fi

      - name: Lint Ansible roles and playbooks
        run: |
          if [ -d "ansible" ]; then
            ansible-lint ansible/ || true
          else
            echo "No ansible directory found, skipping linting."
          fi

  validate-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3002,DL3006,DL3007,DL3008,DL3009,DL3013,DL3015,DL3018,DL3042,DL4006,SC2015,SC2028,DL3059

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all scripts
        run: |
          if [ -d "scripts" ]; then
            find scripts/ -type f -name "*.sh" | \
            xargs -r shellcheck --shell=bash --external-sources --severity=warning || true
          else
            echo "No scripts directory found, skipping ShellCheck."
          fi
