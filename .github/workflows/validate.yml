name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # Also run on merges to main to catch integrations

env:
  # FIXED: Opts into the updated runtime engine to completely clear runner lifecycle deprecation warnings globally
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: |
          # FIXED: Filtered out non-manifest Helm configuration values files (*values.yml) from validation pathing
          find k8s/ -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "*values.yml" | \
          xargs kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  validate-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # FIXED: Pre-install the specific community/general galaxy collections so the linter can resolve custom modules locally
      - name: Pre-Cache External Ansible Collection Dependencies
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install ansible-lint
        run: pip install ansible-lint ansible-core

      # FIXED: Expanded scope to target the complete ansible directory asset tree
      - name: Lint Ansible Ecosystem Roles and Tasks
        run: ansible-lint ansible/

  validate-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3009   # apt pin versions — acceptable for this use case

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute ShellCheck Analysis
        run: |
          find scripts/ -type f -name "*.sh" | xargs shellcheck -e SC2002,SC2129