version: "3.9"
# docker/stack.yml
# CEI Labs Engine — Docker Swarm stack definition.
# Deploy with: ./scripts/stack-up.sh   (wraps: docker stack deploy -c docker/stack.yml cei-labs)
#
# Adding capacity = `docker swarm join` another host, then re-run stack-up.sh.
# Nothing in this file needs to change based on how many nodes exist.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Traefik <-> CTFd only. Deliberately never joined by any challenge
  # instance, so a compromised Juice Shop/target/attacker container can never
  # reach CTFd directly by IP even though both sit behind the same Traefik.
  # NOT internal: Traefik needs this route out for ACME/Let's Encrypt on
  # internet-facing deployments (see the ACME note on the traefik service).
  edge:
    driver: overlay
    attachable: false
  # CTFd <-> DB <-> Redis. Never joined by traefik or anything internet-facing.
  ctfd-internal:
    driver: overlay
    internal: true
  # CTFd <-> orchestrator only, for the instance-launcher plugin's
  # server-to-server calls (Phase 4). Internal-only — never reachable from
  # outside the swarm, and never joined by db/redis or challenge instances.
  orchestrator-internal:
    driver: overlay
    internal: true
  # Traefik <-> trusted per-instance gateways only. No participant-controlled
  # target, attacker, or vulnerable web app joins this shared overlay. Each
  # untrusted workload stays on its dedicated internal network; the hardened
  # gateway proxies only fixed destinations and owns any published ports.
  challenge-edge:
    driver: overlay
    attachable: false
    internal: true

volumes:
  ctfd_db_data:
  ctfd_uploads:
  orchestrator_data:

secrets:
  ctfd_secret_key:
    file: ./secrets/ctfd_secret_key.txt
  ctfd_db_password:
    file: ./secrets/ctfd_db_password.txt
  ctfd_db_root_password:
    file: ./secrets/ctfd_db_root_password.txt
  ctf_key:
    file: ./secrets/ctf_key.txt
  orchestrator_admin_password:
    file: ./secrets/orchestrator_admin_password.txt
  plugin_shared_secret:
    file: ./secrets/plugin_shared_secret.txt

services:
  # ── Ingress ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    command:
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=cei-labs_edge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=false"
      - "--log.level=INFO"
      # LAN/air-gapped default: self-signed cert dropped in ./traefik/certs/ (see README).
      # For internet-facing events, replace with the ACME resolver block documented in README.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      # Default "ingress" mode (Swarm routing mesh): hitting port 80/443 on
      # ANY node in the swarm reaches Traefik, wherever it's actually
      # scheduled. This is what replaces MetalLB — no VIP to manage.
      - target: 80
        published: 80
      - target: 443
        published: 443
    networks:
      - edge
      - challenge-edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    logging: *default-logging

  # ── CTFd scoring platform ────────────────────────────────────────────────────
  ctfd-db:
    image: mariadb:10.11@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
    environment:
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
    secrets:
      - source: ctfd_db_password
        target: ctfd_db_password
      - source: ctfd_db_root_password
        target: ctfd_db_root_password
    entrypoint:
      - /bin/sh
      - -c
      - >
        export MYSQL_PASSWORD="$$(cat /run/secrets/ctfd_db_password)";
        export MYSQL_ROOT_PASSWORD="$$(cat /run/secrets/ctfd_db_root_password)";
        exec docker-entrypoint.sh mariadbd
    volumes:
      - ctfd_db_data:/var/lib/mysql
    networks:
      - ctfd-internal
    deploy:
      placement:
        constraints:
          - node.labels.ctfd-data == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
    logging: *default-logging

  ctfd-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    networks:
      - ctfd-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
    logging: *default-logging

  ctfd:
    image: ghcr.io/${GITHUB_ORG}/cei-labs-engine/ctfd:${IMAGE_TAG}
    environment:
      REDIS_URL: "redis://ctfd-redis:6379"
      UPLOAD_FOLDER: "/var/uploads"
      REVERSE_PROXY: "true"
      WORKERS: "4"
      ORCHESTRATOR_URL: "http://orchestrator:8080"
    secrets:
      - ctfd_secret_key
      - ctfd_db_password
      - plugin_shared_secret
    volumes:
      - ctfd_uploads:/var/uploads
    networks:
      - edge
      - ctfd-internal
      - orchestrator-internal
    depends_on:
      - ctfd-db
      - ctfd-redis
      - orchestrator
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=cei-labs_edge"
        - "traefik.http.services.ctfd.loadbalancer.server.port=8000"
        # Baseline automation/AI-abuse mitigation — see the root README's
        # "Security & Anti-Automation Posture" section for the full picture;
        # this is one layer, CTFd's own submission rate limiting (enabled at
        # setup) is another. Two routers on the same service:
        #   - ctfd-attempt: a tight per-source-IP limit scoped to the flag
        #     submission endpoint specifically, where brute-forcing actually happens.
        #   - ctfd: a much more generous whole-app limit, just to blunt raw
        #     high-volume scraping/automation without affecting normal use.
        - "traefik.http.middlewares.ctfd-attempt-ratelimit.ratelimit.average=2"
        - "traefik.http.middlewares.ctfd-attempt-ratelimit.ratelimit.burst=5"
        - "traefik.http.middlewares.ctfd-attempt-ratelimit.ratelimit.period=1s"
        - "traefik.http.routers.ctfd-attempt.rule=(Host(`ctfd.${BASE_DOMAIN}`) || HostRegexp(`^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$$`)) && Path(`/api/v1/challenges/attempt`)"
        - "traefik.http.routers.ctfd-attempt.entrypoints=web,websecure"
        - "traefik.http.routers.ctfd-attempt.tls=true"
        - "traefik.http.routers.ctfd-attempt.priority=100"
        - "traefik.http.routers.ctfd-attempt.middlewares=ctfd-attempt-ratelimit"
        - "traefik.http.routers.ctfd-attempt.service=ctfd"
        - "traefik.http.middlewares.ctfd-ratelimit.ratelimit.average=50"
        - "traefik.http.middlewares.ctfd-ratelimit.ratelimit.burst=100"
        - "traefik.http.routers.ctfd.rule=Host(`ctfd.${BASE_DOMAIN}`) || HostRegexp(`^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$$`)"
        - "traefik.http.routers.ctfd.entrypoints=web,websecure"
        - "traefik.http.routers.ctfd.tls=true"
        - "traefik.http.routers.ctfd.priority=1"
        - "traefik.http.routers.ctfd.middlewares=ctfd-ratelimit"
    logging: *default-logging

  # ── Challenge Instance Orchestrator ──────────────────────────────────────────
  # Generalized MultiJuicer replacement: spins up per-team Juice Shop instances
  # today, and per-team target+attacker wargame pairs once that content ships.
  # Internal-only — never routed to by Traefik directly. Only CTFd's
  # instance-launcher plugin talks to it (orchestrator-internal network),
  # authenticated with the plugin_shared_secret. It then talks to the Docker
  # API to create/remove the actual challenge containers, which Traefik
  # discovers on its own via challenge-edge once labeled.
  #
  # SECURITY NOTE: this service holds read-write access to the Docker socket,
  # which is equivalent to root on whichever node it runs on. That is the same
  # trust boundary today's MultiJuicer requires (a k8s ServiceAccount allowed
  # to create Pods) — it must only ever run on a trusted manager node.
  orchestrator:
    image: ghcr.io/${GITHUB_ORG}/cei-labs-engine/orchestrator:${IMAGE_TAG}
    environment:
      CHALLENGE_NETWORK: "cei-labs_challenge-edge"
      ORCHESTRATOR_GATEWAY_IMAGE: "ghcr.io/${GITHUB_ORG}/cei-labs-engine/tcp-gateway:${IMAGE_TAG}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
      ORCHESTRATOR_MAX_INSTANCES: "${ORCHESTRATOR_MAX_INSTANCES}"
      ORCHESTRATOR_IDLE_GRACE_MINUTES: "${ORCHESTRATOR_IDLE_GRACE_MINUTES}"
      ORCHESTRATOR_SSH_PORT_RANGE_START: "${ORCHESTRATOR_SSH_PORT_RANGE_START}"
      ORCHESTRATOR_SSH_PORT_RANGE_END: "${ORCHESTRATOR_SSH_PORT_RANGE_END}"
      ORCHESTRATOR_SHUTDOWN_DELAY_SECONDS: "${ORCHESTRATOR_SHUTDOWN_DELAY_SECONDS}"
      ORCHESTRATOR_SHUTDOWN_EXTEND_SECONDS: "${ORCHESTRATOR_SHUTDOWN_EXTEND_SECONDS}"
      ORCHESTRATOR_SHUTDOWN_MAX_EXTENSIONS: "${ORCHESTRATOR_SHUTDOWN_MAX_EXTENSIONS}"
      ORCHESTRATOR_STORE_DB_PATH: "/var/lib/cei-orchestrator/state.db"
    secrets:
      - plugin_shared_secret
      - orchestrator_admin_password
      - ctf_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator_data:/var/lib/cei-orchestrator
    networks:
      - orchestrator-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
    logging: *default-logging
