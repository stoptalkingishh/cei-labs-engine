<label>
	Per-Team Dynamic<br>
	<small>Value is generated per team by the orchestrator at launch time, not set here.</small>
</label>
<div class="form-group">
	<label>Level key</label>
	<input type="text" class="form-control" name="data" value="{{ data }}" placeholder="e.g. krypton2">
	<small class="form-text text-muted">Must match the key this level's per-team secret is returned under in the orchestrator's `access` dict for this instance/instance_group.</small>
</div>
<input type="hidden" name="content" value="{{ content }}">
<input type="hidden" name="type" value="per_team_dynamic">
<input type="hidden" name="id" value="{{ id }}">
<hr>
<div class="form-group">
	<button class="btn btn-success float-right">Update</button>
</div>
