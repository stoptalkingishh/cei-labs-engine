# ansible/inventory.ini
# Target Node Configurations — Ubuntu 24.04 LTS
# Ensure SSH key authentication is configured from your deployment machine to all target hosts.
#
# There is no deployment-mode toggle: this inventory IS the topology. Add or
# remove hosts under [swarm_workers] and re-run ansible/site.yml to resize
# the swarm — nothing else needs to change.

# ----------------------------------------------------------------------------
# SINGLE-HOST (e.g. laptop / local VM / small event)
# ----------------------------------------------------------------------------
# [swarm_managers]
# node1 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_connection=local
#
# [swarm_workers]
# (leave empty — everything runs on node1)

# ----------------------------------------------------------------------------
# MULTI-HOST (default — add/remove worker lines freely)
# ----------------------------------------------------------------------------
[swarm_managers]
node1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key

[swarm_workers]
node2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key
node3 ansible_host=192.168.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key

[swarm_cluster:children]
swarm_managers
swarm_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
