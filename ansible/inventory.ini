# ansible/inventory.ini
# Target Node Configurations — Ubuntu 24.04 LTS (Air-Gap / LAN Event Staging)
# Ensure SSH key authentication is configured from your deployment machine to all target hosts.

# ============================================================================
# TARGET DEPLOYMENT TOPOLOGY CHOICE
# ============================================================================
# To toggle your environment topology mode:
#   1. Set 'deployment_mode' in ansible/group_vars/all.yml to match your targets.
#   2. Comment/Uncomment the structural option blocks below as appropriate.

# ----------------------------------------------------------------------------
# OPTION A: STANDALONE / SINGLE-HOST DEPLOYMENT MODE (e.g., Laptop / Local PC)
# ----------------------------------------------------------------------------
# [control_plane]
# node1 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_connection=local
#
# [workers]
# node1 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_connection=local
#
# [juiceshop_workers]
# node1 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_connection=local
#
# [analyst_workers]
# node1 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_connection=local


# ----------------------------------------------------------------------------
# OPTION B: STANDARD 3-NODE PRODUCTION CLUSTER (Default Configuration)
# ----------------------------------------------------------------------------
[control_plane]
node1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key

[workers]
node2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key
node3 ansible_host=192.168.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ctf_key

# --- Dedicated Target Workload Placement Mappings ---
# Pins multi-user dynamic Juice Shop containers cleanly to node2 (Resolves Item B1)
[juiceshop_workers]
node2

# Pins isolated participant analyst workspace pods cleanly to node3
[analyst_workers]
node3


# ============================================================================
# CLUSTER ENGINE METADATA (Applies Globally Across All Modes)
# ============================================================================
[k3s_cluster:children]
control_plane
workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3