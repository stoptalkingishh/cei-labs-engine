---
# ansible/site.yml
# Top-level playbook orchestrating the CEI Labs Engine infrastructure.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/site.yml

- name: Phase 1 - Global Prerequisite & Security Hardening Baseline
  hosts: all
  become: true
  serial: "100%"
  tags: ["always", "common"]
  roles:
    - role: common

- name: Phase 2 - Initialize Control Plane Infrastructure
  hosts: control_plane
  become: true
  serial: 1 # Provision primary cluster masters sequentially to avoid split-brain join states
  tags: ["infra", "k3s-server"]
  roles:
    - role: k3s-server

- name: Phase 3 - Join Worker & Analyst Nodes to Cluster Runtime
  hosts: workers:analyst_workers
  become: true
  serial: "50%"
  tags: ["infra", "k3s-agent"]
  roles:
    - role: k3s-agent

- name: Phase 4 - Provision Core Networking & Bare-Metal Load Balancer
  hosts: control_plane[0]
  tags: ["networking", "metallb"]
  tasks:
    - name: Deploy MetalLB layer-2 infrastructure routing rules
      ansible.builtin.include_role:
        name: metallb

- name: Phase 5 - Verify Cluster Structural Readiness & Seed Environments
  hosts: control_plane[0]
  tags: ["apps", "bootstrap"]
  tasks:
    # FIXED (Item 3): Replaced heavy k8s modules with native, fast kubectl shell checks
    - name: Validate all worker cluster nodes are reporting Ready state
      ansible.builtin.shell: |
        kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -qv "False"
      register: nodes_ready
      until: nodes_ready.rc == 0
      retries: 30
      delay: 10
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    # FIXED (Item 3): Standard kubectl shell application ensures zero-dependency execution
    - name: Seed internal cluster namespace topologies
      ansible.builtin.shell: |
        kubectl apply -f "{{ playbook_dir }}/../k8s/namespaces/namespaces.yml"
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

# NOTE: Phase 6 has been deleted per Item 7 design requirements.
# Post-provisioning setup should be completed manually by executing `./scripts/platform-up.sh` on the control plane.