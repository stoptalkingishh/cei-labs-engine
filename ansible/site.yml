---
# ansible/site.yml
# Top-level playbook orchestrating elastic cyber range infrastructure layers.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/site.yml

- name: Phase 0 - Dependency and Collection Acquisition Baseline
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if required collections are already installed locally
      ansible.builtin.command: ansible-galaxy collection list
      register: local_collections_check
      changed_when: false
      failed_when: false

    - name: Ensure prerequisite external collections are locally cached
      ansible.builtin.command: ansible-galaxy collection install --ignore-errors -r {{ playbook_dir }}/requirements.yml
      when: local_collections_check.rc != 0 or "kubernetes.core" not in local_collections_check.stdout
      changed_when: false

- name: Phase 1 - Global Prerequisite and Security Hardening Baseline
  hosts: all
  become: true
  serial: "100%"
  tags: ["always", "common"]
  roles:
    - role: common

- name: Phase 2 - Initialize Control Plane Infrastructure
  hosts: >-
    {{ groups['control_plane'] | default([]) +
       groups['initial_master_node'] | default([]) +
       groups['master_nodes'] | default([]) }}
  become: true
  serial: 1
  tags: ["infra", "k3s-server"]
  roles:
    - role: k3s-server

- name: Phase 3 - Join Worker and Analyst Nodes to Cluster Runtime
  hosts: >-
    {{ groups['workers'] | default([]) +
       groups['analyst_workers'] | default([]) +
       groups['juiceshop_workers'] | default([]) +
       groups['worker_nodes'] | default([]) }}
  become: true
  serial: "50%"
  tags: ["infra", "k3s-agent"]
  roles:
    - role: k3s-agent

- name: Phase 4 - Provision Core Networking and Bare-Metal Load Balancer
  hosts: >-
    {{ (groups['control_plane'] | default([]) +
        groups['initial_master_node'] | default([]) +
        groups['master_nodes'] | default([])) | first | default('localhost') }}
  tags: ["networking", "metallb"]
  tasks:
    - name: Deploy MetalLB layer-2 infrastructure routing rules
      ansible.builtin.include_role:
        name: metallb
      when: >
        groups['initial_master_node'] is defined or
        groups['control_plane'] is defined or
        groups['master_nodes'] is defined

- name: Phase 5 - Verify Cluster Readiness and Apply Node Labels
  hosts: >-
    {{ (groups['control_plane'] | default([]) +
        groups['initial_master_node'] | default([]) +
        groups['master_nodes'] | default([])) | first | default('localhost') }}
  tags: ["apps", "bootstrap"]
  tasks:
    - name: Validate unique physical cluster nodes are reporting Ready state
      ansible.builtin.shell: |
        set -o pipefail
        ready_count=$(kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null \
          | tr ' ' '\n' | grep -c '^True$' || echo 0)
        echo "$ready_count"
      register: ready_nodes_check
      changed_when: false
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      until: >
        (ready_nodes_check.stdout | trim | int) == (
        (groups.control_plane | default([]) +
         groups.initial_master_node | default([]) +
         groups.master_nodes | default([]) +
         groups.workers | default([]) +
         groups.worker_nodes | default([]) +
         groups.analyst_workers | default([]) +
         groups.juiceshop_workers | default([])) | unique | length
        )
      retries: 30
      delay: 10
      failed_when: false

    - name: Handle cluster readiness validation failure
      ansible.builtin.fail:
        msg: >
          Cluster readiness check failed. Expected total nodes:
          {{ (groups.control_plane | default([]) + groups.initial_master_node | default([]) + groups.master_nodes | default([]) +
              groups.workers | default([]) + groups.worker_nodes | default([]) +
              groups.analyst_workers | default([]) + groups.juiceshop_workers | default([])) | unique | length }}
      when: >
        (ready_nodes_check.stdout | trim | int) != (
        (groups.control_plane | default([]) +
         groups.initial_master_node | default([]) +
         groups.master_nodes | default([]) +
         groups.workers | default([]) +
         groups.worker_nodes | default([]) +
         groups.analyst_workers | default([]) +
         groups.juiceshop_workers | default([])) | unique | length
        )

    - name: Tag analyst compute nodes with topology label
      ansible.builtin.shell: |
        kubectl label node {{ item }} role=analyst --overwrite
      loop: "{{ groups.analyst_workers | default([]) }}"
      when: >
        groups['analyst_workers'] is defined and (groups['analyst_workers'] | length > 0)
      changed_when: true
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Tag Juice Shop compute nodes with topology label
      ansible.builtin.shell: |
        kubectl label node {{ item }} role=juiceshop --overwrite
      loop: "{{ groups.juiceshop_workers | default([]) }}"
      when: >
        groups['juiceshop_workers'] is defined and (groups['juiceshop_workers'] | length > 0)
      changed_when: true
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Tag single host with all roles in standalone deployment mode
      ansible.builtin.shell: |
        kubectl label node --all role=analyst --overwrite
        kubectl label node --all role=juiceshop --overwrite
      when: >
        groups['initial_master_node'] is defined and (groups['initial_master_node'] | length > 0)
      changed_when: true
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Seed internal cluster namespace topologies
      ansible.builtin.shell: |
        kubectl apply -f "{{ playbook_dir }}/../k8s/namespaces/namespaces.yml"
      changed_when: true
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
