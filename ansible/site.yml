---
# ansible/site.yml
# Top-level playbook orchestrating elastic cyber range infrastructure layers.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/site.yml

- name: Phase 0 - Dependency & Collection Acquisition Baseline
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure prerequisite external collections are locally cached
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      changed_when: false

- name: Phase 1 - Global Prerequisite & Security Hardening Baseline
  hosts: all
  become: true
  serial: "100%"
  tags: ["always", "common"]
  roles:
    - role: common

- name: Phase 2 - Initialize Control Plane Infrastructure
  hosts: control_plane
  become: true
  serial: 1 # Provision primary cluster masters sequentially to avoid split-brain join states
  tags: ["infra", "k3s-server"]
  roles:
    - role: k3s-server

- name: Phase 3 - Join Worker & Analyst Nodes to Cluster Runtime
  hosts: workers:analyst_workers:juiceshop_workers
  become: true
  serial: "50%"
  tags: ["infra", "k3s-agent"]
  roles:
    - role: k3s-agent

- name: Phase 4 - Provision Core Networking & Bare-Metal Load Balancer
  hosts: control_plane[0]
  tags: ["networking", "metallb"]
  tasks:
    - name: Deploy MetalLB layer-2 infrastructure routing rules
      ansible.builtin.include_role:
        name: metallb
      when: hostvars[groups['control_plane'][0]]['use_metallb'] | default(true) | bool

- name: Phase 5 - Verify Cluster Structural Readiness & Target Tagging
  hosts: control_plane[0]
  tags: ["apps", "bootstrap"]
  tasks:
    - name: Validate unique physical cluster nodes are reporting Ready state
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | tr ' ' '\n' | grep -c '^True$'
      register: ready_nodes_count
      changed_when: false
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
      # Uses | default([]) Jinja2 filter (not Python .get()) and | unique to deduplicate
      # overlapping group assignments in single-host or dual-node deployment modes
      until: >
        ready_nodes_count.stdout | int == (
        (groups['control_plane'] | default([]) +
         groups['workers'] | default([]) +
         groups['analyst_workers'] | default([]) +
         groups['juiceshop_workers'] | default([])) | unique | length
        )
      retries: 30
      delay: 10

    - name: Explicitly tag designated analyst compute nodes with topology labels
      ansible.builtin.shell: |
        kubectl label node {{ item }} role=analyst --overwrite
      loop: "{{ groups['analyst_workers'] | default([]) }}"
      when: hostvars[groups['control_plane'][0]]['deployment_mode'] | default('cluster') != 'single'
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Explicitly tag designated Juice Shop compute nodes with topology labels
      ansible.builtin.shell: |
        kubectl label node {{ item }} role=juiceshop --overwrite
      loop: "{{ groups['juiceshop_workers'] | default([]) }}"
      when: hostvars[groups['control_plane'][0]]['deployment_mode'] | default('cluster') != 'single'
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Tag local single host with all roles when running in standalone mode
      ansible.builtin.shell: |
        kubectl label node --all role=analyst --overwrite
        kubectl label node --all role=juiceshop --overwrite
      when: hostvars[groups['control_plane'][0]]['deployment_mode'] | default('cluster') == 'single'
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

    - name: Seed internal cluster namespace topologies
      ansible.builtin.shell: |
        kubectl apply -f "{{ playbook_dir }}/../k8s/namespaces/namespaces.yml"
      environment:
        KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
