---
# ansible/site.yml
# Provisions the Docker Swarm CEI Labs runs on.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/site.yml
#
# There is no topology/deployment-mode variable to set: the inventory *is*
# the topology. One host under [swarm_managers] and nothing else forms a
# single-node swarm; add hosts under [swarm_workers] (now or later, then
# re-run this playbook) and the same stack schedules across all of them.

- name: Phase 1 - Common host baseline (all nodes)
  hosts: all
  become: true
  roles:
    - role: common

- name: Phase 2 - Form/grow the Docker Swarm
  hosts: all
  become: true
  # A partial swarm is worse than a failed one: the linear strategy already
  # guarantees the primary manager's init/token tasks finish before anyone
  # joins, so if the primary manager fails, no other host can join and the
  # only useful outcome is a loud stop. Without this, the play limps on and
  # reports a pile of unrelated per-host failures that all trace back to
  # one unreachable manager.
  any_errors_fatal: true
  roles:
    - role: swarm
