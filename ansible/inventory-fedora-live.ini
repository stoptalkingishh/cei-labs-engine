# ansible/inventory-fedora-live.ini
# Live Fedora Swarm inventory for the current CEI-Labs deployment.
#
# Targets the current OPNsense LAN/server network: 192.168.10.0/24, gateway
# 192.168.10.1 (the OPNsense box). This is NOT the older 192.168.1.0/24
# station network, and it is not the five-VLAN / VLAN-20 reference topology.
# Player Wi-Fi stays separate on 10.10.32.0/22 and is NOT a Swarm network.
#
# The swarm role and site.yml are network-agnostic (see ansible/site.yml: "the
# inventory is the topology"). Point this file at the live Fedora nodes and run:
#
#     ansible-playbook -i ansible/inventory-fedora-live.ini ansible/site.yml
#
# STATUS (refreshed from the operator workstation on 2026-08-05):
#   - Current reported Fedora server pool:
#       192.168.10.235 (host.local)
#       192.168.10.112 (fedora.local)
#       192.168.10.192 (fedora-2.local)
#       192.168.10.67  (fedora3.local)
#   - All four hosts answer ping on 192.168.10.0/24, but SSH port 22 and
#     Docker/Swarm ports (2377, 7946, 4789) were closed from the operator
#     workstation during this refresh.
#   - Luna owns OPNsense static DHCP/static-IP reservations and server internet
#     validation. Do not run Swarm deployment until those addresses are stable
#     and outbound IPv4 internet works from the Fedora hosts.
#   - 192.168.10.120 : operator laptop only. Do NOT add it to this inventory
#                      or count its Docker Desktop Swarm as CEI Labs capacity.
#   - The operator reported the Fedora login user as ismaelrodriguez. Do not
#     commit passwords or private key paths. Make SSH reachable and use an
#     external credential path before this inventory is runnable.
#   - Do not add NETGEAR AP devices (10.10.32.2, 10.10.32.3) here — they are
#     Player-WiFi bridge/AP hardware, not Swarm nodes.

# ----------------------------------------------------------------------------
# LIVE FEDORA SWARM (192.168.10.0/24)
# ----------------------------------------------------------------------------
[swarm_managers]
fedora-2 ansible_host=192.168.10.192 ansible_user=ismaelrodriguez

[swarm_workers]
# Enable these after SSH, static addressing, OS identity, and internet access
# are verified on each host.
# host ansible_host=192.168.10.235 ansible_user=ismaelrodriguez
# fedora ansible_host=192.168.10.112 ansible_user=ismaelrodriguez
# fedora3 ansible_host=192.168.10.67 ansible_user=ismaelrodriguez

[swarm_cluster:children]
swarm_managers
swarm_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
