# ansible/inventory-fedora-live.ini
# Live Fedora Swarm inventory for the current CEI-Labs deployment.
#
# Targets the current OPNsense LAN/server network: 192.168.10.0/24, gateway
# 192.168.10.1 (the OPNsense box). This is NOT the older 192.168.1.0/24
# station network, and it is not the five-VLAN / VLAN-20 reference topology.
# Player Wi-Fi stays separate on 10.10.32.0/22 and is NOT a Swarm network.
#
# The swarm role and site.yml are network-agnostic (see ansible/site.yml: "the
# inventory is the topology"). Point this file at the live Fedora nodes and run:
#
#     ansible-playbook -i ansible/inventory-fedora-live.ini ansible/site.yml
#
# STATUS (verified from the live box on 2026-08-05, via the operator/CTF LAN):
#   - 192.168.10.192 : first confirmed server candidate; SSH port is open, but
#                      Docker/Swarm ports (2377, 7946, 4789) are not yet open.
#   - 192.168.10.235 : DHCP/lease candidate only; OS and SSH not confirmed.
#   - The operator must confirm SSH credentials and the OS identity for each
#     accepted node before this inventory is runnable. Fill in the real
#     ansible_user / ansible_ssh_private_key_file below once confirmed.
#   - Do not add NETGEAR AP devices (10.10.32.2, 10.10.32.3) here — they are
#     Player-WiFi bridge/AP hardware, not Swarm nodes.

# ----------------------------------------------------------------------------
# LIVE FEDORA SWARM (192.168.10.0/24)
# ----------------------------------------------------------------------------
[swarm_managers]
node1 ansible_host=192.168.10.192 ansible_user=CHANGE_ME ansible_ssh_private_key_file=~/.ssh/CHANGE_ME

[swarm_workers]
# Add additional accepted Fedora nodes here, e.g.:
# node2 ansible_host=192.168.10.235 ansible_user=CHANGE_ME ansible_ssh_private_key_file=~/.ssh/CHANGE_ME

[swarm_cluster:children]
swarm_managers
swarm_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
