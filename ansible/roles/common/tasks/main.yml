---
# ansible/roles/common/tasks/main.yml
# Runs on every node. Installs prerequisites, hardens SSH, sets up firewall.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - fail2ban
      - htop
      - tmux
      - unzip
      - jq
      - open-iscsi
      - nfs-common
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Harden SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart sshd

- name: Harden SSH — disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: UFW — allow K3s API server (control plane only)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  when: >
    (groups['control_plane'] is defined and inventory_hostname in groups['control_plane']) or
    (groups['initial_master_node'] is defined and inventory_hostname in groups['initial_master_node']) or
    (groups['master_nodes'] is defined and inventory_hostname in groups['master_nodes'])

- name: UFW — allow K3s Flannel VXLAN
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp

- name: UFW — allow K3s kubelet metrics
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp

- name: UFW — allow HTTP/HTTPS (ingress)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: >
    (groups['control_plane'] is defined and inventory_hostname in groups['control_plane']) or
    (groups['initial_master_node'] is defined and inventory_hostname in groups['initial_master_node']) or
    (groups['master_nodes'] is defined and inventory_hostname in groups['master_nodes'])

- name: UFW — allow participant SSH ports (analyst containers)
  community.general.ufw:
    rule: allow
    port: "30000:32767"
    proto: tcp
  when: >
    (groups['analyst_workers'] is defined and inventory_hostname in groups['analyst_workers']) or
    (groups['worker_nodes'] is defined and inventory_hostname in groups['worker_nodes']) or
    (ansible_connection == 'local')

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Flush handlers now
  ansible.builtin.meta: flush_handlers
