---
# ansible/roles/common/tasks/main.yml
# Runs on every node. Installs prerequisites, hardens SSH, sets up the
# firewall for Docker Swarm (replaces the old K3s-specific port set).

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - fail2ban
      - htop
      - tmux
      - unzip
      - jq
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Harden SSH — disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart sshd

- name: Harden SSH — disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: UFW — allow Docker Swarm cluster management (manager nodes)
  community.general.ufw:
    rule: allow
    port: "2377"
    proto: tcp

- name: UFW — allow Docker Swarm node communication (all nodes)
  community.general.ufw:
    rule: allow
    port: "7946"
    proto: "{{ item }}"
  loop: ["tcp", "udp"]

- name: UFW — allow Docker Swarm overlay network data path (all nodes)
  community.general.ufw:
    rule: allow
    port: "4789"
    proto: udp

- name: UFW — allow HTTP/HTTPS
  # Every node needs this open, not just managers — Traefik is reached via
  # Swarm's routing mesh, which can forward from any node regardless of
  # where the traefik service is actually scheduled.
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: UFW — allow participant workspace ports (bulk-spawned analyst/kali + orchestrator instances)
  community.general.ufw:
    rule: allow
    port: "30000:32767"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Flush handlers now
  ansible.builtin.meta: flush_handlers
