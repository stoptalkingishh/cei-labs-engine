---
# Runs on every node. Supports Debian-family hosts through UFW and
# Fedora/RedHat-family hosts through firewalld.

- name: Reject unsupported operating-system families
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in common_supported_os_families
    fail_msg: >-
      Unsupported OS family {{ ansible_facts.os_family }}. The common role
      supports Debian/Ubuntu and Fedora/RedHat-family hosts.

- name: Update apt cache on Debian-family hosts
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Install common and OS-specific system packages
  ansible.builtin.package:
    name: >-
      {{ common_base_packages
         + common_os_packages[ansible_facts.os_family] }}
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart SSH

- name: Harden SSH - disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart SSH

- name: Configure UFW ingress rules on Debian-family hosts
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "CEI Labs: {{ item.description }}"
  loop: "{{ common_ufw_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  when: ansible_facts.os_family == "Debian"

- name: Enable UFW with default-deny ingress on Debian-family hosts
  community.general.ufw:
    state: enabled
    policy: deny
  when: ansible_facts.os_family == "Debian"

- name: Enable and start firewalld on Fedora/RedHat-family hosts
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_facts.os_family == "RedHat"

- name: Configure firewalld ingress rules on Fedora/RedHat-family hosts
  ansible.posix.firewalld:
    zone: "{{ common_firewalld_zone }}"
    port: "{{ item.port }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ common_firewalld_rules }}"
  loop_control:
    label: "{{ item.port }}"
  when: ansible_facts.os_family == "RedHat"

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Flush handlers now
  ansible.builtin.meta: flush_handlers
