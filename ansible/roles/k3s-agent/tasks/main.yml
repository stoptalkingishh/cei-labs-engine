---
# ansible/roles/k3s-agent/tasks/main.yml
# Joins worker nodes to the K3s cluster.

- name: Check if K3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_URL="https://{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}:6443" \
    K3S_TOKEN="{{ k3s_token }}" \
    sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  register: k3s_agent_install
  changed_when: k3s_agent_install.rc == 0
  tags: [k3s]

- name: Enable and start K3s agent
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true
  tags: [k3s]