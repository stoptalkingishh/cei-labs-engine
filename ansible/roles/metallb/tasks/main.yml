---
# ansible/roles/metallb/tasks/main.yml
# Installs MetalLB via Helm and configures an IP address pool.
# MetalLB gives Traefik and other LoadBalancer services a real LAN IP.

- name: Add MetalLB Helm repo
  # FIXED: Converted module to fully-qualified collection name (FQCN)
  ansible.builtin.command: helm repo add metallb https://metallb.github.io/metallb
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Update Helm repos
  # FIXED: Converted module to FQCN
  ansible.builtin.command: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install MetalLB
  # FIXED: Converted module to FQCN
  ansible.builtin.command: >
    helm upgrade --install metallb metallb/metallb
    --namespace metallb-system
    --create-namespace
    --wait
    --timeout 3m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: metallb_install
  changed_when: "'already deployed' not in metallb_install.stdout"

- name: Wait for MetalLB pods to be ready
  # FIXED: Converted module to FQCN
  ansible.builtin.command: kubectl rollout status deployment/metallb-controller -n metallb-system
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  # FIXED: Prevented arbitrary state updates during polling checks
  changed_when: false
  retries: 10
  delay: 15

- name: Apply MetalLB IP address pool
  # FIXED: Converted module to FQCN
  ansible.builtin.copy:
    dest: /tmp/metallb-ippool.yml
    # FIXED: Added explicit permission boundaries to resolve security parameters
    mode: "0644"
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: ctf-pool
        namespace: metallb-system
      spec:
        addresses:
          - {{ metallb_ip_range }}
      ---
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: ctf-l2
        namespace: metallb-system
      spec:
        ipAddressPools:
          - ctf-pool

- name: Apply MetalLB pool manifest
  # FIXED: Converted module to FQCN
  ansible.builtin.command: kubectl apply -f /tmp/metallb-ippool.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: metallb_pool_apply
  # FIXED: Tracks real configuration adjustments to the live routing field
  changed_when: "'configured' in metallb_pool_apply.stdout or 'created' in metallb_pool_apply.stdout"