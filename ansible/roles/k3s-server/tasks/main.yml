---
# ansible/roles/k3s-server/tasks/main.yml
# Installs K3s on the control plane node.
# Disables built-in Traefik so we can install a pinned version via Helm.
# Disables built-in ServiceLB (Klipper) so MetalLB can manage LoadBalancer IPs.

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    INSTALL_K3S_EXEC="server \
      --disable=traefik \
      --disable=servicelb \
      --write-kubeconfig-mode=644 \
      --service-node-port-range=30000-32767 \
      --token={{ k3s_token }}" \
    sh -
  when: not k3s_binary.stat.exists
  changed_when: true
  tags: [k3s]

- name: Wait for K3s to be ready
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/kubectl get nodes
  register: nodes_ready
  retries: 20
  delay: 10
  until: nodes_ready.rc == 0
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tags: [k3s]

# Using get_url instead of shell+curl to satisfy ansible-lint
# command-instead-of-module rule
- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: "0755"
  tags: [helm]

- name: Install Helm
  ansible.builtin.shell: |
    set -o pipefail
    /tmp/get-helm-3.sh
  args:
    creates: /usr/local/bin/helm
  changed_when: true
  tags: [helm]

- name: Ensure .kube directory exists for deployment user
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    owner: "{{ ansible_real_user_id }}"
    group: "{{ ansible_real_group_id }}"
    mode: "0700"

- name: Copy kubeconfig to user home
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_env.HOME }}/.kube/config"
    owner: "{{ ansible_real_user_id }}"
    group: "{{ ansible_real_group_id }}"
    mode: "0600"
    remote_src: true
  tags: [k3s]

- name: Add KUBECONFIG to user bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: '^export KUBECONFIG='
    line: "export KUBECONFIG={{ ansible_env.HOME }}/.kube/config"
    state: present