---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ctf-wildcard-tls
  namespace: traefik
spec:
  secretName: ctf-wildcard-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: "*.ctf.local"
  dnsNames:
    - "ctf.local"
    - "*.ctf.local"