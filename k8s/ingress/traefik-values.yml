---
# k8s/ingress/traefik-values.yml
# Traefik Ingress Controller Value Definitions
# Configured for MetalLB external IP assignment and automated HTTPS redirection.

deployment:
  replicas: 1

# Pin the Ingress Controller daemon specifically to your control-plane node
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

# FIXED (Item 1): Switched type to LoadBalancer so MetalLB binds a distinct LAN IP address
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    # FIXED (Item B3): Disabled the global redirect to break infinite loops during air-gapped/LAN setups.
    # Individual routes can now cleanly negotiate Port 80 traffic.
    # redirectTo:
    #   port: websecure
    #   priority: 10
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

ingressClassResource:
  enabled: true
  default: true
  name: traefik

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

# Resources tailored to prevent high traffic volume event starvation
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"