# k8s/ingress/traefik-values.yml
deployment:
  replicas: 1

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443

ingressClassResource:
  enabled: true
  default: true

providers:
  kubernetesCRD:
    enabled: true