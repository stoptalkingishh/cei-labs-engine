---
# k8s/ingress/traefik-values.yml
# Traefik v3 Ingress Controller Helm values.
# Configured for MetalLB external IP assignment on bare-metal LAN events.
#
# TLS NOTE: This config serves HTTP and HTTPS both without forced redirect.
# For LAN/air-gap events, HTTP is acceptable and avoids cert trust issues
# on participant laptops. The self-signed cert from cert-issuer.yml is used
# for HTTPS but will show a browser warning until trusted manually.
# To enforce HTTPS-only after distributing the CA cert, re-enable redirectTo.

deployment:
  replicas: 1

# Pin Traefik to the control-plane node
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

# MetalLB assigns a LAN IP to this LoadBalancer service
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    # TLS is handled at the IngressRoute level + cert-manager; removed invalid inline tls

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"