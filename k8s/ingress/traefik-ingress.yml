# k8s/ingress/traefik-ingress.yml
# Traefik IngressRoute definitions for all platform services.
#
# Prerequisites:
#   - namespaces.yml applied (creates traefik, ctfd, multijuicer, registry ns)
#   - Traefik installed via Helm into the traefik namespace:
#
#   helm repo add traefik https://traefik.github.io/charts
#   helm repo update
#   helm upgrade --install traefik traefik/traefik \
#     -f k8s/ingress/traefik-values.yml \
#     --namespace traefik \
#     --create-namespace \
#     --wait
#
# See k8s/ingress/traefik-values.yml for Helm configuration.

---
# CTFd IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd-ingress
  namespace: ctfd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ctfd.ctf.local`)
      kind: Rule
      services:
        - name: ctfd
          port: 80

---
# MultiJuicer IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: multijuicer-ingress
  namespace: multijuicer
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`juiceshop.ctf.local`)
      kind: Rule
      services:
        # FIXED: Synchronized name to multijuicer to align with the K8s service resource name
        - name: multijuicer
          port: 3000

---
# Registry IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingress
  namespace: registry
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`registry.ctf.local`)
      kind: Rule
      services:
        # FIXED: Validated targeting the internal cluster registry service exposure
        - name: registry
          port: 5000