---
# CTFd IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd-ingress
  namespace: ctfd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ctfd.ctf.local`)
      kind: Rule
      services:
        - name: ctfd
          port: 80

---
# MultiJuicer IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: multijuicer-ingress
  namespace: multijuicer
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`juiceshop.ctf.local`)
      kind: Rule
      services:
        - name: multijuicer
          port: 3000

---
# Registry IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingress
  namespace: registry
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`registry.ctf.local`)
      kind: Rule
      services:
        - name: registry
          port: 5000