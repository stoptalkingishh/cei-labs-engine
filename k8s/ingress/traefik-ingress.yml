---
# k8s/ingress/traefik-ingress.yml
# Traefik IngressRoute definitions for all platform services.
# Routes match both the .ctf.local FQDN and direct LAN IP routes.

# CTFd IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd-ingress
  namespace: ctfd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ctfd.ctf.local`) || HostRegexp(`{ip:[0-9.]+}`)
      kind: Rule
      services:
        - name: ctfd
          port: 80
  tls:
    secretName: ctf-wildcard-tls-secret

---
# MultiJuicer IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: multijuicer-ingress
  namespace: multijuicer
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`juiceshop.ctf.local`) || (HostRegexp(`{ip:[0-9.]+}`) && PathPrefix(`/balancer`))
      kind: Rule
      services:
        - name: multijuicer
          port: 3000
  tls:
    secretName: ctf-wildcard-tls-secret

---
# Registry IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingress
  namespace: registry
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`registry.ctf.local`)
      kind: Rule
      services:
        - name: registry
          port: 5000
  tls:
    secretName: ctf-wildcard-tls-secret