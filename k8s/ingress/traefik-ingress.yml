---
# k8s/ingress/traefik-ingress.yml
# Traefik IngressRoute definitions for all platform services.
# Each route listens on both web (HTTP/80) and websecure (HTTPS/443).
# TLS uses the wildcard self-signed certificate from cert-issuer.yml
# (secretName: ctf-wildcard-tls-secret in namespace traefik).
#
# For LAN events, participants may see a browser cert warning on HTTPS.
# HTTP (port 80) works without any cert trust requirement.

# CTFd IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd-ingress
  namespace: ctfd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ctfd.ctf.local`)
      kind: Rule
      services:
        - name: ctfd
          port: 80
  tls:
    secretName: ctf-wildcard-tls-secret

---
# MultiJuicer IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: multijuicer-ingress
  namespace: multijuicer
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`juiceshop.ctf.local`)
      kind: Rule
      services:
        - name: multijuicer
          port: 3000
  tls:
    secretName: ctf-wildcard-tls-secret

---
# Registry IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingress
  namespace: registry
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`registry.ctf.local`)
      kind: Rule
      services:
        - name: registry
          port: 5000
  tls:
    secretName: ctf-wildcard-tls-secret
