# k8s/ctfd/values.yml
# CTFd v3.8.2 deployment via Helm.
# Apply with: helm upgrade --install ctfd ctfd/ctfd -f k8s/ctfd/values.yml -n ctfd
#
# NOTE: CTFd does not have an official Helm chart.
# We deploy it via the community chart or directly via the manifests below.
# Using manifest approach for full control — see ctfd-deployment.yml

# This file documents all configuration values used by ctfd-deployment.yml.

ctfd:
  image: "ctfd/ctfd:3.8.2"
  replicas: 1
  secret_key: ""           # Set via Kubernetes Secret — see ctfd-secret.yml
  upload_folder: "/var/uploads"

database:
  image: "mariadb:10.11"
  name: "ctfd"
  user: "ctfd"
  password: ""             # Set via Kubernetes Secret
  root_password: ""        # Set via Kubernetes Secret

cache:
  image: "redis:7-alpine"

ingress:
  host: "ctfd.ctf.local"  # Change to your base_domain
