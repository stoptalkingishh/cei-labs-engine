---
# k8s/network-policies.yml
# Zero-Trust Isolation Architecture for the CEI Labs Infrastructure Stack.
# Establishes absolute namespace boundaries and locks down lateral cluster movement.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-default-deny-ingress
  namespace: analyst
spec:
  # Selecting an empty podSelector drops all ingress traffic by default across the namespace
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-egress-whitelist
  namespace: analyst
spec:
  podSelector:
    matchLabels:
      app: analyst
  policyTypes:
    - Egress
  egress:
    # Rule 1: Explicitly allow internal core DNS resolution queries
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Rule 2: Explicit target allow-list mapping to the labs environment
    # Restricts analyst environments to designated target systems in the challenges namespace,
    # dropping all lateral traffic to administrative tools (ctfd, traefik, registry) or external networks.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: challenges