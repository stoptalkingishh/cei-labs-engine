---
# k8s/network-policies.yml
# Defensive Zero-Trust Egress Filtering Policy for Analyst Workspaces.
# Restricts lateral cluster movement and blocks unauthorized outbound manipulation.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyst-egress-whitelist
  namespace: analyst
spec:
  podSelector:
    matchLabels:
      app: analyst
  policyTypes:
    - Egress
  egress:
    # Rule 1: Explicitly allow internal core DNS resolution queries
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # FIXED (Item 3): Switched from a leaky inverted black-list to an explicit target allow-list.
    # This allows analyst pods to communicate with target systems in the challenges namespace,
    # while automatically dropping traffic to ctfd, traefik, registry, or external internet networks.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: challenges