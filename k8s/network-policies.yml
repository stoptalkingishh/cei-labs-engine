---
# k8s/network-policies.yml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-analyst-to-platform
  namespace: analyst
spec:
  podSelector:
    matchLabels:
      app: analyst
  policyTypes:
    - Egress
  egress:
    # Allow local DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # FIXED: Replaced invalid shorthand string array with an explicit matchExpressions NotIn filter block
    # Deny direct lateral movement into core platform namespaces
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - ctfd
                  - traefik
                  - registry