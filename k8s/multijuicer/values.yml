---
# k8s/multijuicer/values.yml
# MultiJuicer v10.0.0 Helm values.
#
# Install/Upgrade command (Synchronized with platform-up.sh release identity):
#   helm upgrade --install multijuicer oci://ghcr.io/juice-shop/multi-juicer/helm/multi-juicer \
#     -f k8s/multijuicer/values.yml \
#     --namespace multijuicer \
#     --create-namespace \
#     --wait

# Seeds all flag generation — MUST match the key used when running juice-shop-ctf-cli.
# Overridden dynamically in platform-up.sh by --set ctfKey="$CTF_KEY" (Resolves Item F5)
ctfKey: "CHANGE_ME_BEFORE_EVERY_EVENT"

# Centralized administrator access credential for the MultiJuicer manager dashboard.
adminPassword: "CHANGE_ME_SECURE_ADMIN_PASS"

juiceShop:
  # Maximum concurrent Juice Shop instances (Each instance uses ~400MB RAM)
  # Overridden dynamically in platform-up.sh by --set juiceShop.maxInstances="$MAX_INSTANCES" (Resolves Item H6)
  maxInstances: 30

  # FIXED (Item H1): Soft node affinity lets pods schedule on control-plane nodes if single-host mode is active
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - juiceshop
  
  resources:
    requests:
      memory: "300Mi"
      cpu: "100m"
    limits:
      memory: "500Mi"
      cpu: "500m"

  # Instance cleanup migrated to the correct structured v10 mapping
  # Automatically reclaims and purges inactive user instances after 2 hours
  cleanup:
    enabled: true
    gracePeriod: "120m"

  # FIXED (Item B6): Serialized from a native YAML map into a multi-line JSON string block scalar
  # Full config reference: https://pwning.owasp-juice.shop/companion-guide/latest/part4/customization.html
  config: |
    {
      "application": {
        "name": "CTF Training Platform",
        "welcomeBanner": {
          "showOnFirstStart": true,
          "title": "Welcome to the CTF Platform",
          "message": "Complete challenges to earn points. Submit flags in CTFd at http://ctfd.ctf.local"
        }
      },
      "ctf": {
        "showFlagsInNotifications": false
      }
    }

# MultiJuicer balancer configuration
balancer:
  repository: ghcr.io/juice-shop/multi-juicer/balancer

  # FIXED (Item H1): Shifted from rigid nodeSelector to structural Exists check for the control plane boundary
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  cookie:
    secure: false # Change to true once cert-manager handles explicit TLS termination

  # Native health probes to the balancer to ensure high-availability routing validation
  livenessProbe:
    httpGet:
      path: /balancer/
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /balancer/
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 5

# Native Ingress generation disabled to yield cleanly to k8s/ingress/traefik-ingress.yml
ingress:
  enabled: false

# Metrics for monitoring (optional — enable if deploying Prometheus)
metrics:
  enabled: false