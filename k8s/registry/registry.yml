---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-registry-pvc
  namespace: registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-registry
  template:
    metadata:
      labels:
        app: local-registry
    spec:
      # Hardened Node Affinity (Fixed Item 1): Evaluates existence of the label key 
      # to support key-only syntax variations commonly implemented by K3s engines
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          # Operational Probes (Fixed Item 3): Prevents routing traffic to a deadlocked registry service
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: registry-vol
              mountPath: /var/lib/registry
      volumes:
        - name: registry-vol
          # Decoupled Storage Backend (Fixed Item 4): Replaces volatile hostPath
          persistentVolumeClaim:
            claimName: local-registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: local-registry
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP